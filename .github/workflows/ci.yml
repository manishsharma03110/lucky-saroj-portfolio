name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      NEXT_PUBLIC_SITE_URL: https://lucky-saroj-portfolio.vercel.app
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-placeholder-secret-not-for-production
      PORTFOLIO_MEDIA_READ_WRITE_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Account validation and policy tests
        run: npx tsx --test src/lib/auth/account-validation.test.ts

      - name: Replay SQL migrations
        run: npm run ci:migrate

      - name: Verify Phase 9 schema
        run: npm run ci:verify-phase9

      - name: Build
        env:
          NODE_ENV: test
        run: npm run build

      - name: Install browser test dependencies
        run: npm install --prefix e2e --ignore-scripts

      - name: Install fixture generator
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Chromium
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Prepare disposable browser database
        run: |
          node --input-type=module -e "import pg from 'pg'; const c=new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query('CREATE DATABASE portfolio_e2e'); await c.end();"
          DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/portfolio_e2e npm run ci:migrate

      - name: Critical browser regressions
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/portfolio_e2e
          E2E_ADMIN_EMAIL: regression@example.test
          E2E_ADMIN_PASSWORD: ci-disposable-test-password-only
          CMS_ALLOW_DESTRUCTIVE_LOCAL_DB_TESTS: "1"
        run: cd e2e && npm test

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
